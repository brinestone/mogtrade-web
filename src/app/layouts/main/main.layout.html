<div hlmSidebarWrapper>
  <hlm-sidebar>
    <div hlmSidebarHeader></div>
    <div hlmSidebarContent>
      <div hlmSidebarGroup></div>
    </div>
    <div hlmSidebarFooter>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <button hlmSidebarMenuButton [hlmDropdownMenuTrigger]="settingsMenu">
            <div class="flex gap-x-2 items-center">
              <!-- Insert avatar here -->
              <div class="space-y-0.5">
                <p class="text-sm line-clamp-1 font-semibold">
                  {{ principal()?.displayName ?? 'User' }}
                </p>
                <p class="text-xs text-muted-foreground line-clamp-1">
                  {{ principal()?.email ?? '' }}
                </p>
              </div>
            </div>
            <ng-icon name="lucideEllipsis" class="ml-auto" />
          </button>
          <ng-template #settingsMenu>
            <hlm-dropdown-menu class="w-60">
              <button hlmDropdownMenuItem>
                <ng-icon name="lucideSettings" /><span>Settings</span>
              </button>
              <hlm-dropdown-menu-separator />
              <button variant="destructive" hlmDropdownMenuItem (click)="logout()">
                <ng-icon name="lucideLogOut" /><span>Logout</span>
              </button>
            </hlm-dropdown-menu>
          </ng-template>
        </li>
      </ul>
    </div>
  </hlm-sidebar>
  <main hlmSidebarInset>
    <header class="flex h-8 border-b border-muted items-center justify-between px-4">
      <button hlmSidebarTrigger><span class="sr-only"></span></button>
    </header>
    <router-outlet />
  </main>
</div>
